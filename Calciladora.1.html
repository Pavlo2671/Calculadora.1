<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧾 Calculadora de Precio con IVA + Historial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      background-color: #f0f8ff;
      transition: background 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #1e1e1e;
      color: #ffffff;
    }
    .container {
      max-width: 650px;
    }
    .result-box {
      background: #eafaf1;
      border-left: 6px solid #27ae60;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
    }
    .dark-mode .result-box {
      background: #2c3e50;
      border-left-color: #2ecc71;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9rem;
      color: #888;
    }
    table {
      font-size: 0.9rem;
    }
    .dark-mode table {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container mt-5 animate__animated animate__fadeIn">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>📊 Calculadora de Precio</h2>
      <button class="btn btn-outline-secondary btn-sm" onclick="toggleDarkMode()">🌙 Modo oscuro</button>
    </div>

    <div class="card shadow p-4">
      <form id="calcForm">
        <div class="mb-3">
          <label for="cost" class="form-label">💰 Costo base del producto</label>
          <input type="number" class="form-control" id="cost" required min="0" step="0.01">
        </div>
        <div class="mb-3">
          <label for="profit" class="form-label">📈 Porcentaje de ganancia (%)</label>
          <input type="number" class="form-control" id="profit" required min="0" step="0.1">
        </div>
        <div class="mb-3">
          <label for="iva" class="form-label">🧾 IVA (%) <small>(opcional)</small></label>
          <input type="number" class="form-control" id="iva" value="16" min="0" step="0.1">
        </div>
        <button type="submit" class="btn btn-success w-100">Calcular</button>
      </form>

      <div id="result" class="result-box mt-4 d-none animate__animated animate__fadeInUp">
        <h5>💡 Resultado:</h5>
        <p><strong>Precio sin IVA:</strong> $<span id="price"></span></p>
        <p><strong>Ganancia:</strong> $<span id="gain"></span></p>
        <p><strong>IVA:</strong> $<span id="ivaAmount"></span></p>
        <p><strong>Total con IVA:</strong> $<span id="total"></span></p>
        <div class="mt-3">
          <button class="btn btn-outline-primary me-2" onclick="exportToPDF()">📄 PDF</button>
          <button class="btn btn-outline-success" onclick="exportToExcel()">📊 Excel</button>
        </div>
      </div>
    </div>

    <div class="mt-5">
      <h5>📝 Historial de cálculos</h5>
      <table class="table table-bordered mt-2" id="historyTable">
        <thead class="table-light">
          <tr>
            <th>Costo</th>
            <th>Ganancia (%)</th>
            <th>Ganancia</th>
            <th>Precio</th>
            <th>IVA</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="footer">Herramienta para emprendedores y negocios digitales 🚀</div>
  </div>

  <script>
    let resultData = {};

    document.getElementById("calcForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const cost = parseFloat(document.getElementById("cost").value);
      const profit = parseFloat(document.getElementById("profit").value);
      const iva = parseFloat(document.getElementById("iva").value);

      const gain = cost * (profit / 100);
      const price = cost + gain;
      const ivaAmount = price * (iva / 100);
      const total = price + ivaAmount;

      resultData = { cost, profit, gain, price, ivaAmount, total };

      document.getElementById("price").textContent = price.toFixed(2);
      document.getElementById("gain").textContent = gain.toFixed(2);
      document.getElementById("ivaAmount").textContent = ivaAmount.toFixed(2);
      document.getElementById("total").textContent = total.toFixed(2);
      document.getElementById("result").classList.remove("d-none");

      // Añadir al historial
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>$${cost.toFixed(2)}</td>
        <td>${profit}%</td>
        <td>$${gain.toFixed(2)}</td>
        <td>$${price.toFixed(2)}</td>
        <td>$${ivaAmount.toFixed(2)}</td>
        <td>$${total.toFixed(2)}</td>`;
      document.querySelector("#historyTable tbody").prepend(row);
    });

    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("📊 Cálculo de Precio de Venta", 20, 20);
      doc.setFontSize(12);
      doc.text(`Costo base: $${resultData.cost.toFixed(2)}`, 20, 40);
      doc.text(`Ganancia (%): ${resultData.profit}%`, 20, 50);
      doc.text(`Ganancia: $${resultData.gain.toFixed(2)}`, 20, 60);
      doc.text(`Precio sin IVA: $${resultData.price.toFixed(2)}`, 20, 70);
      doc.text(`IVA aplicado: $${resultData.ivaAmount.toFixed(2)}`, 20, 80);
      doc.text(`Total con IVA: $${resultData.total.toFixed(2)}`, 20, 90);

      doc.save("precio_venta.pdf");
    }

    function exportToExcel() {
      const wsData = [
        ["Concepto", "Valor"],
        ["Costo base", resultData.cost],
        ["Porcentaje de ganancia (%)", resultData.profit],
        ["Ganancia", resultData.gain],
        ["Precio sin IVA", resultData.price],
        ["IVA", resultData.ivaAmount],
        ["Total con IVA", resultData.total],
      ];

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, "PrecioVenta");
      XLSX.writeFile(wb, "precio_venta.xlsx");
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }
  </script>
</body>
</html>
